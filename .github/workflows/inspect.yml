name: Inspect Studionet execution
on:
  workflow_dispatch:
  push:
    paths: ['scripts/inspect_studionet.mjs']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: node scripts/inspect_studionet.mjs
